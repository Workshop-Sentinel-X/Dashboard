services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: sentinelx-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  influxdb:
    image: influxdb:2.7
    container_name: sentinelx-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:-admin1234}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-sentinelx}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-telemetry}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:-sentinelx-super-token-admin}
    volumes:
      - influxdb_data:/var/lib/influxdb2

  telegraf:
    image: telegraf:1.32
    container_name: sentinelx-telegraf
    restart: unless-stopped
    depends_on:
      - mosquitto
      - influxdb
    environment:
      INFLUX_ORG: ${INFLUX_ORG:-sentinelx}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-telemetry}
      INFLUX_TOKEN: ${INFLUX_TOKEN:-sentinelx-super-token-admin}
      MQTT_TELEGRAF_PASSWORD: ${MQTT_TELEGRAF_PASSWORD:-telegraf-sx}
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro

  grafana:
    image: grafana/grafana:11.2.0
    container_name: sentinelx-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - influxdb
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      INFLUX_ORG: ${INFLUX_ORG:-sentinelx}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-telemetry}
      INFLUX_TOKEN: ${INFLUX_TOKEN:-sentinelx-super-token-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards

volumes:
  mosquitto_data:
  mosquitto_log:
  influxdb_data:
  grafana_data:
