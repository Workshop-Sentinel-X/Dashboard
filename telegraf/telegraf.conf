[agent]
  interval = "5s"
  flush_interval = "5s"
  omit_hostname = true

# 1) Télémétrie VALIDÉE par FastAPI (signature HMAC OK) -> mesure "telemetry"
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:8883"]
  username = "telegraf"
  password = "${MQTT_TELEGRAF_PASSWORD}"
  topics = ["sentinel/validated"]
  data_format = "json"
  name_override = "telemetry"
  tag_keys = ["device_id"]

# 2) Score de l'Isolation Forest -> mesure "scores"
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:8883"]
  username = "telegraf"
  password = "${MQTT_TELEGRAF_PASSWORD}"
  topics = ["sentinel/scores"]
  data_format = "json"
  name_override = "scores"
  tag_keys = ["device_id"]

# 3) Alertes (CYBER_SPOOFING, INTRUSION, ANOMALY...) -> mesure "alerts"
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:8883"]
  username = "telegraf"
  password = "${MQTT_TELEGRAF_PASSWORD}"
  topics = ["sentinel/alerts"]
  data_format = "json"
  name_override = "alerts"
  tag_keys = ["code", "source", "severity"]
  json_string_fields = ["message"]

# Garantit un champ numérique "event" sur chaque alerte (pour les compteurs)
[[processors.defaults]]
  namepass = ["alerts"]
  [processors.defaults.fields]
    event = 1

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
